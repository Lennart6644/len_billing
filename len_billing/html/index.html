<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
<title>Billing</title>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
        <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
    </defs>
</svg>
<div id="app" class="hidden">
    <div id="sheet" class="issue">
        <header id="tabs" class="hidden">
            <span class="head-title" data-i18n="ui_bills_title"></span>
            <button class="tab" data-view="job"><i class="fa-solid fa-building-columns"></i><span data-i18n="ui_tab_job"></span></button>
            <button class="tab" data-view="private"><i class="fa-solid fa-user"></i><span data-i18n="ui_tab_private"></span></button>
            <button class="tab-close" id="btn-close"><i class="fa-solid fa-xmark"></i></button>
        </header>
        <main id="view"></main>
    </div>
    <button id="float-close" class="hidden"><i class="fa-solid fa-xmark"></i></button>
    <div id="overlay" class="hidden">
        <div class="overlay-card">
            <i id="overlay-icon"></i>
            <div id="overlay-text"></div>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
